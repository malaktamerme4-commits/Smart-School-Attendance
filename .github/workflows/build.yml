name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          cd ..
          flutter create --platforms=android --org com.smartschool --project-name smart_school_attendance Smart-School-Attendance-Temp
          cp -r Smart-School-Attendance-Temp/android ./Smart-School-Attendance/
          cp Smart-School-Attendance-Temp/.gitignore ./Smart-School-Attendance/.gitignore || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-school-attendance-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
